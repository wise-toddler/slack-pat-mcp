[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slack-pat-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Slack using PAT (Personal Access Token)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Shivansh Singh", email = "wiseeldrich2004@gmail.com" }
]
keywords = ["slack", "mcp", "model-context-protocol", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/wise-toddler/slack-pat-mcp"
Repository = "https://github.com/wise-toddler/slack-pat-mcp"
Issues = "https://github.com/wise-toddler/slack-pat-mcp/issues"

[project.scripts]
slack-pat-mcp = "slack_pat_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_pat_mcp"]
